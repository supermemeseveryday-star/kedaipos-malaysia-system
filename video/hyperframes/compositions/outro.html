<!doctype html>
<html lang="zh" data-composition-variables='[
  {"id":"t2","type":"number","label":"Second line starts (s)","default":5.2},
  {"id":"dur","type":"number","label":"Duration (s)","default":10.5}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="../shared.css" />
    <style>
      #root { background: var(--green); }
      #rings { position: absolute; left: 960px; top: 400px; }
      .ring { position: absolute; border: 3px solid #ffffff1c; border-radius: 50%; transform: translate(-50%, -50%); }
      #logo-row { position: absolute; top: 170px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 38px; }
      #mark { width: 170px; height: 170px; border-radius: 44px; background: var(--mint); display: grid; place-items: center; font: 800 108px/1 "WenQuanYi Zen Hei", sans-serif; color: var(--green); box-shadow: 0 24px 60px #0005; }
      #word { font: 800 132px/1 Inter, sans-serif; color: #fff; letter-spacing: -0.04em; }
      #slogan { position: absolute; top: 400px; left: 0; right: 0; text-align: center; }
      #slogan .zh { font: 700 60px/1.2 "WenQuanYi Zen Hei", sans-serif; color: #fff; }
      #slogan .en { font: 500 36px/1.4 Inter, sans-serif; color: #a9d6bd; margin-top: 10px; }
      #chips { position: absolute; top: 560px; left: 0; right: 0; display: flex; justify-content: center; gap: 22px; }
      .chip { background: #ffffff14; border: 2px solid #ffffff30; color: #e8f3ec; border-radius: 999px; padding: 14px 30px; font: 600 32px/1 "WenQuanYi Zen Hei", Inter, sans-serif; }
      .chip em { font-style: normal; color: #a9d6bd; font-family: Inter, sans-serif; font-weight: 500; margin-left: 10px; }
      #gh { position: absolute; top: 670px; left: 50%; width: 1560px; margin-left: -780px; height: 132px; border-radius: 30px; background: #fff; box-shadow: 0 30px 80px #0006; display: flex; align-items: center; gap: 30px; padding: 0 44px; }
      #gh svg { flex: 0 0 auto; }
      #gh .url { font: 700 38px/1 Inter, sans-serif; color: var(--ink); letter-spacing: -0.01em; white-space: nowrap; }
      #gh .url span { color: var(--muted); font-weight: 500; }
      #cursor { position: absolute; width: 4px; height: 46px; background: var(--green); margin-left: 4px; display: inline-block; vertical-align: middle; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="outro" data-start="0" data-duration="10.5" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="10.5">
        <div id="rings">
          <div class="ring" style="width:700px;height:700px"></div>
          <div class="ring" style="width:1100px;height:1100px"></div>
          <div class="ring" style="width:1500px;height:1500px"></div>
        </div>
        <div id="logo-row"><div id="mark">店</div><div id="word">Kedai POS</div></div>
        <div id="slogan">
          <div class="zh">让小店收银更简单</div>
          <div class="en">Checkout made simple for small shops</div>
        </div>
        <div id="chips">
          <div class="chip">免费<em>Free</em></div>
          <div class="chip">开源<em>Open source</em></div>
          <div class="chip">离线可用<em>Works offline</em></div>
          <div class="chip">三语界面<em>中 · EN · BM</em></div>
        </div>
        <div id="gh">
          <svg width="64" height="64" viewBox="0 0 16 16" aria-hidden="true"><path fill="#17231e" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          <div class="url"><span>github.com/</span><b id="typed"></b><i id="cursor"></i></div>
        </div>
      </div>
    </div>

    <script>
      const { t2, dur } = window.__hyperframes.getVariables();
      document.getElementById('root').dataset.duration = dur;
      document.querySelectorAll('.clip').forEach(el => (el.dataset.duration = dur));
      const repo = 'supermemeseveryday-star/kedaipos-malaysia-system';
      const typed = document.getElementById('typed');
      const ease = 'power3.out';
      const tl = gsap.timeline({ paused: true });

      tl.fromTo('.ring', { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.4, stagger: 0.15, ease }, 0);
      tl.to('#rings', { rotation: 12, scale: 1.06, duration: dur, ease: 'none' }, 0);
      tl.fromTo('#mark', { scale: 0, rotation: -25 }, { scale: 1, rotation: 0, duration: 0.7, ease: 'back.out(1.8)' }, 0.2);
      tl.fromTo('#word', { x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease }, 0.45);
      tl.fromTo('#slogan', { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease }, 0.9);
      tl.fromTo('.chip', { y: 30, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, stagger: 0.12, ease: 'back.out(1.6)' }, 1.6);

      // GitHub card arrives with the "download on GitHub" line, then the repo path types itself out.
      tl.fromTo('#gh', { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease }, t2 - 0.3);
      const typing = { n: 0 };
      tl.to(typing, { n: repo.length, duration: 1.6, ease: 'none', onUpdate: () => { typed.textContent = repo.slice(0, Math.round(typing.n)); } }, t2 + 0.2);
      tl.set(typed, { textContent: '' }, 0);
      for (let t = 0; t < dur; t += 1) tl.set('#cursor', { opacity: 0 }, t + 0.5).set('#cursor', { opacity: 1 }, t + 1);
      tl.to('#stage', { opacity: 0, duration: 0.6, ease: 'power1.in' }, dur - 0.6);

      window.__timelines = window.__timelines || {};
      window.__timelines['outro'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
