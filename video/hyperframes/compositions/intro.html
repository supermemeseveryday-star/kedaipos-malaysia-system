<!doctype html>
<html lang="zh" data-composition-variables='[
  {"id":"t2","type":"number","label":"Second line starts (s)","default":5.2},
  {"id":"t3","type":"number","label":"Third line starts (s)","default":9.8},
  {"id":"dur","type":"number","label":"Duration (s)","default":13.8}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="../shared.css" />
    <style>
      #root { background: var(--paper); }
      .scene { position: absolute; inset: 0; }

      /* A: the paper notebook */
      #notebook {
        position: absolute; left: 50%; top: 120px; width: 760px; height: 520px; margin-left: -380px;
        background: #fffdf6; border-radius: 22px; box-shadow: 0 40px 90px #3b2d0f22, 0 2px 0 #e9dfc4;
        transform: rotate(-3deg); overflow: hidden;
      }
      #notebook::before { /* ruled lines */
        content: ""; position: absolute; inset: 0;
        background: repeating-linear-gradient(#fffdf6 0 58px, #d9e4f2 58px 60px);
        background-position: 0 70px;
      }
      #notebook::after { /* margin line */
        content: ""; position: absolute; top: 0; bottom: 0; left: 110px; width: 3px; background: #f0b9b0;
      }
      .entry { position: absolute; left: 150px; font: italic 500 40px/1 "DejaVu Serif", "WenQuanYi Zen Hei", serif; color: #2c3e66; white-space: nowrap; }
      .entry b { position: absolute; left: 360px; font-weight: 500; }
      #cross path { fill: none; stroke: var(--red); stroke-width: 22; stroke-linecap: round; }

      /* B: pain point cards */
      .pain {
        position: absolute; top: 200px; width: 620px; height: 470px; border-radius: 34px; background: #fff;
        box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
      }
      #fee { left: 250px; }
      #net { right: 250px; }
      .pain .big { font: 800 100px/1 Inter, sans-serif; color: var(--ink); letter-spacing: -0.03em; position: relative; }
      .pain .label { font: 700 46px/1.2 "WenQuanYi Zen Hei", sans-serif; color: var(--muted); text-align: center; }
      .pain .label small { display: block; font: 600 30px/1.3 Inter, sans-serif; margin-top: 8px; }
      .strike { position: absolute; left: -16px; right: -16px; top: 52%; height: 14px; border-radius: 8px; background: var(--red); transform-origin: left center; }
      .badge-off { position: absolute; right: -40px; top: -26px; background: var(--red); color: #fff; font: 800 30px/1 Inter, sans-serif; padding: 12px 18px; border-radius: 14px; }

      /* C: brand reveal */
      #brand { background: var(--green); }
      #glow { position: absolute; width: 1400px; height: 1400px; left: 260px; top: -460px; border-radius: 50%; background: radial-gradient(circle, #2f8f62 0%, #15583d00 62%); }
      #logo-row { position: absolute; top: 300px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 46px; }
      #mark { width: 220px; height: 220px; border-radius: 56px; background: var(--mint); display: grid; place-items: center; font: 800 140px/1 "WenQuanYi Zen Hei", sans-serif; color: var(--green); box-shadow: 0 30px 80px #0005; }
      #word { font: 800 168px/1 Inter, sans-serif; color: #fff; letter-spacing: -0.04em; display: flex; }
      #word span { display: inline-block; }
      #tagline { position: absolute; top: 600px; left: 0; right: 0; text-align: center; color: #d6eedf; }
      #tagline .zh { font: 700 56px/1.2 "WenQuanYi Zen Hei", sans-serif; }
      #tagline .en { font: 500 36px/1.4 Inter, sans-serif; margin-top: 10px; color: #a9d6bd; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="intro" data-start="0" data-duration="13.8" data-width="1920" data-height="1080">

      <div id="sceneA" class="scene clip" data-start="0" data-duration="13.8">
        <div id="notebook">
          <div class="entry" style="top:96px">Teh tarik × 12<b>RM 33.60</b></div>
          <div class="entry" style="top:156px">Nasi lemak × 8<b>RM 36.00</b></div>
          <div class="entry" style="top:216px">Roti canai × 15<b>RM 27.00</b></div>
          <div class="entry" style="top:276px">找钱?? 欠 RM 5<b>RM ??.??</b></div>
          <div class="entry" style="top:336px">Kopi O × 9<b>RM 19.80</b></div>
          <div class="entry" style="top:396px">合计 Total<b>RM 1??.40</b></div>
          <svg id="cross" width="760" height="520" viewBox="0 0 760 520" style="position:absolute;inset:0">
            <path id="cross1" d="M120 100 L650 440" />
            <path id="cross2" d="M650 100 L120 440" />
          </svg>
        </div>
      </div>

      <div id="sceneB" class="scene clip" data-start="0" data-duration="13.8">
        <div id="fee" class="pain">
          <div class="big">RM ???<span style="font-size:54px;color:var(--muted)"> /月</span><div class="strike" id="feeStrike"></div></div>
          <div class="label">月费太贵<small>Pricey monthly fees</small></div>
        </div>
        <div id="net" class="pain">
          <svg width="200" height="150" viewBox="0 0 200 150" style="position:relative">
            <path d="M20 60 Q100 -10 180 60" fill="none" stroke="#c9d3cd" stroke-width="18" stroke-linecap="round" />
            <path d="M50 92 Q100 50 150 92" fill="none" stroke="#c9d3cd" stroke-width="18" stroke-linecap="round" />
            <circle cx="100" cy="125" r="16" fill="#c9d3cd" />
          </svg>
          <div class="badge-off" id="offBadge">OFFLINE</div>
          <div class="label">断网就停摆<small>Stuck when the internet drops</small></div>
        </div>
      </div>

      <div id="brand" class="scene clip" data-start="0" data-duration="13.8">
        <div id="glow"></div>
        <div id="logo-row">
          <div id="mark">店</div>
          <div id="word"><span>K</span><span>e</span><span>d</span><span>a</span><span>i</span><span>&nbsp;</span><span>P</span><span>O</span><span>S</span></div>
        </div>
        <div id="tagline">
          <div class="zh">马来西亚小店的免费收银系统</div>
          <div class="en">Free, open-source POS for Malaysian small shops</div>
        </div>
      </div>
    </div>

    <script>
      const { t2, t3, dur } = window.__hyperframes.getVariables();
      document.getElementById('root').dataset.duration = dur;
      document.querySelectorAll('.clip').forEach(el => (el.dataset.duration = dur));
      const ease = 'power3.out';
      const tl = gsap.timeline({ paused: true });

      // A: notebook drops in, gets crossed out, leaves
      tl.set('#sceneB, #brand', { opacity: 0 }, 0);
      tl.fromTo('#notebook', { y: 120, opacity: 0, rotation: -9 }, { y: 0, opacity: 1, rotation: -3, duration: 0.9, ease }, 0.1);
      tl.from('.entry', { opacity: 0, x: -20, duration: 0.35, stagger: 0.28, ease: 'power2.out' }, 0.6);
      ['#cross1', '#cross2'].forEach((id, i) => {
        tl.fromTo(id, { strokeDasharray: 700, strokeDashoffset: 700 }, { strokeDashoffset: 0, duration: 0.45, ease: 'power2.in' }, t2 - 1.6 + i * 0.35);
      });
      tl.to('#notebook', { y: -80, opacity: 0, scale: 0.92, duration: 0.5, ease: 'power2.in' }, t2 - 0.35);

      // B: two pain-point cards
      tl.set('#sceneB', { opacity: 1 }, t2 - 0.2);
      tl.fromTo('#fee', { x: -220, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease }, t2 - 0.1);
      tl.fromTo('#net', { x: 220, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease }, t2 + 0.15);
      tl.fromTo('#feeStrike', { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: 'power2.inOut' }, t2 + 1.4);
      tl.fromTo('#offBadge', { scale: 0, rotation: -20 }, { scale: 1, rotation: 8, duration: 0.45, ease: 'back.out(2.5)' }, t2 + 2.2);
      tl.to('#fee, #net', { y: 40, opacity: 0, duration: 0.4, ease: 'power2.in', stagger: 0.08 }, t3 - 0.45);

      // C: brand reveal
      tl.fromTo('#brand', { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.6, ease }, t3 - 0.15);
      tl.fromTo('#mark', { scale: 0, rotation: -25 }, { scale: 1, rotation: 0, duration: 0.7, ease: 'back.out(1.8)' }, t3 + 0.1);
      tl.fromTo('#word span', { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, stagger: 0.05, ease }, t3 + 0.3);
      tl.fromTo('#tagline', { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease }, t3 + 0.9);
      tl.to('#glow', { x: 220, duration: dur - t3 + 0.5, ease: 'none' }, t3 - 0.15);

      window.__timelines = window.__timelines || {};
      window.__timelines['intro'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
